name: Mutation testing

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Full repository campaign, or only the supplied changed sources/tests
        type: choice
        options: [full, changed]
        default: full
      source:
        description: Changed Swift source paths, one per line (used for changed scope)
        type: string
        required: false
      test_file:
        description: Test file paths to select, one per line (empty runs the full test target)
        type: string
        required: false
      test_suite:
        description: Suite names to select, one per line
        type: string
        required: false
      test_name:
        description: Test function or Swift Testing display names, one per line
        type: string
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation-testing:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4
      - name: Find previous successful nightly report
        id: previous_nightly
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "mutation.yml",
              branch: process.env.GITHUB_REF_NAME,
              event: "schedule",
              status: "success",
              per_page: 1,
            });
            core.setOutput("run_id", data.workflow_runs[0]?.id ?? "");
      - name: Download previous nightly report
        if: steps.previous_nightly.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: swift-mutation-testing-report
          path: ${{ runner.temp }}/swift-mutation-baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_nightly.outputs.run_id }}
      - name: Validate changed source scope
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'changed'
        shell: bash
        env:
          SOURCE_PATHS: ${{ inputs.source }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_PATHS//[[:space:]]/}" ]]; then
            echo "Changed scope requires at least one source path." >&2
            exit 1
          fi
      - name: Select Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEVELOPER_DIR:-}" && -d /Applications/Xcode.app/Contents/Developer ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          fi
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: Summarize nightly comparison baseline
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
        shell: bash
        env:
          BASELINE_RUN_ID: ${{ steps.previous_nightly.outputs.run_id }}
        run: |
          if [[ -n "$BASELINE_RUN_ID" ]]; then
            printf 'Comparing with [successful scheduled run %s](%s/%s/actions/runs/%s). Gate: fail on new survivors or a score drop greater than 5 percentage points.\n' \
              "$BASELINE_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$BASELINE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous successful scheduled report was found; baseline comparisons are skipped for this run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run full or targeted mutation campaign
        uses: ./.github/actions/run-mutation-testing
        with:
          project-path: .
          project-kind: swift-package
          source: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'changed' && inputs.source || '' }}
          test-file: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'changed' && inputs.test_file || '' }}
          suite: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'changed' && inputs.test_suite || '' }}
          test: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'changed' && inputs.test_name || '' }}
          operator-tier: experimental
          parallelism: "2"
          build-timeout: "600"
          baseline-timeout: "300"
          mutant-timeout: "120"
          maximum-integrity-warnings: "0"
          baseline-report: ${{ steps.previous_nightly.outputs.run_id != '' && format('{0}/swift-mutation-baseline/report.json', runner.temp) || '' }}
          maximum-score-drop: ${{ steps.previous_nightly.outputs.run_id != '' && '0.05' || '' }}
          fail-on-new-survivors: ${{ steps.previous_nightly.outputs.run_id != '' && 'true' || 'false' }}
          output-path: .swift-mutation-testing
