name: Run Swift mutation testing
description: Run the Swift mutation CLI, add its Markdown report to the job summary, and upload compact reports.
inputs:
  project:
    description: Swift package root or .xcodeproj/.xcworkspace path
    required: false
    default: ""
  project-path:
    description: Legacy alias for project
    required: false
    default: ""
  project-kind:
    description: swift-package, xcode-project, or xcode-workspace
    required: false
    default: swift-package
  mutation-source:
    description: Source files/directories to mutate, one relative path per line; empty selects all Swift source
    required: false
    default: ""
  source:
    description: Legacy alias for mutation-source
    required: false
    default: ""
  test-file:
    description: Test files to run, one path per line; adds matching tests from any test target in the selected scheme
    required: false
    default: ""
  test-package-root:
    description: Local Swift package folders containing selected test files, relative to the project root, one path per line; needed when the Xcode project does not list those package test files directly
    required: false
    default: ""
  source-commit:
    description: Commit to analyze; enables changed source and test selection by default
    required: false
    default: ""
  source-base:
    description: Base commit for the comparison; blank compares with the source commit's first parent
    required: false
    default: ""
  source-scope:
    description: all or changed; blank defaults to changed when source-commit is set
    required: false
    default: ""
  test-scope:
    description: all, changed, matching, or changed-and-matching; blank defaults to changed-and-matching when source-commit is set
    required: false
    default: ""
  test-file-suffix:
    description: Suffix appended to a changed source basename to find related tests; default Tests.swift; one suffix per line
    required: false
    default: ""
  test-suite:
    description: Test suite names, one per line; adds matching tests from any test target in the selected scheme
    required: false
    default: ""
  suite:
    description: Legacy alias for test-suite
    required: false
    default: ""
  test-name:
    description: Test function or custom Swift Testing name, one per line; adds matching tests from any test target in the selected scheme
    required: false
    default: ""
  test:
    description: Legacy alias for test-name
    required: false
    default: ""
  scheme:
    description: Xcode scheme
    required: false
    default: ""
  test-target:
    description: Xcode test targets to run in full, one target per line; selectors can add tests from other targets in the selected scheme
    required: false
    default: ""
  test-targets:
    description: Legacy alias for test-target
    required: false
    default: ""
  destination-simulator:
    description: xcodebuild destination
    required: false
    default: ""
  destination:
    description: Legacy alias for destination-simulator
    required: false
    default: ""
  xcodebuild-arg:
    description: Xcode build setting in NAME=VALUE form, one per line
    required: false
    default: ""
  operator-tier:
    description: experimental or all; conservative and default are unavailable until operators have campaign data
    required: false
    default: experimental
  operators:
    description: Comma-separated mutation operators, same values as --operators; blank uses all operators in the selected tier
    required: false
    default: ""
  workers:
    description: Number of simultaneous mutation workers; iOS Simulator runs get separate automatically managed simulators
    required: false
    default: ""
  parallelism:
    description: Legacy alias for workers
    required: false
    default: "2"
  cache-path:
    description: Cache journal directory, relative to the project root
    required: false
    default: ""
  no-cache:
    description: Disable reading and writing the verdict journal
    required: false
    default: "false"
  no-resume:
    description: Ignore prior journal verdicts but continue writing the journal
    required: false
    default: "false"
  no-suppressions:
    description: Ignore source suppression comments
    required: false
    default: "false"
  require-suppression-reason:
    description: Ignore suppression comments that do not include a reason
    required: false
    default: "false"
  build-timeout:
    description: Build timeout in seconds
    required: false
    default: "600"
  baseline-timeout:
    description: Baseline test timeout in seconds
    required: false
    default: "300"
  mutant-timeout:
    description: Per-mutant test-command timeout in seconds
    required: false
    default: "30"
  minimum-score:
    description: Minimum mutation score as a fraction from 0 to 1
    required: false
    default: ""
  baseline-report:
    description: Previous report JSON used for score-drop and new-survivor gates
    required: false
    default: ""
  maximum-score-drop:
    description: Maximum mutation-score decrease from the supplied baseline, from 0 to 1
    required: false
    default: ""
  fail-on-new-survivors:
    description: Fail when a mutant survives now but was not in the supplied baseline's survivor set
    required: false
    default: "false"
  maximum-integrity-warnings:
    description: Maximum allowed integrity warnings
    required: false
    default: "0"
  output:
    description: Report directory relative to GITHUB_WORKSPACE
    required: false
    default: ""
  output-path:
    description: Legacy alias for output
    required: false
    default: .swift-mutation-testing
  tool-path:
    description: Optional path to a CLI built by the build-cli action
    required: false
    default: ""
outputs:
  report-directory:
    description: Directory containing report.md and report.json
    value: ${{ steps.arguments.outputs.report-directory }}
  run-status:
    description: completed or skipped because no changed production Swift files were found
    value: ${{ steps.arguments.outputs.run-status }}
runs:
  using: composite
  steps:
    - name: Build command arguments
      id: arguments
      shell: bash
      env:
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_PROJECT_PATH: ${{ inputs.project-path }}
        INPUT_PROJECT_KIND: ${{ inputs.project-kind }}
        INPUT_MUTATION_SOURCE: ${{ inputs.mutation-source }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_TEST_FILE: ${{ inputs.test-file }}
        INPUT_TEST_PACKAGE_ROOT: ${{ inputs.test-package-root }}
        INPUT_SOURCE_COMMIT: ${{ inputs.source-commit }}
        INPUT_SOURCE_BASE: ${{ inputs.source-base }}
        INPUT_SOURCE_SCOPE: ${{ inputs.source-scope }}
        INPUT_TEST_SCOPE: ${{ inputs.test-scope }}
        INPUT_TEST_FILE_SUFFIX: ${{ inputs.test-file-suffix }}
        INPUT_TEST_SUITE: ${{ inputs.test-suite }}
        INPUT_SUITE: ${{ inputs.suite }}
        INPUT_TEST_NAME: ${{ inputs.test-name }}
        INPUT_TEST: ${{ inputs.test }}
        INPUT_SCHEME: ${{ inputs.scheme }}
        INPUT_TEST_TARGET: ${{ inputs.test-target }}
        INPUT_TEST_TARGETS: ${{ inputs.test-targets }}
        INPUT_DESTINATION_SIMULATOR: ${{ inputs.destination-simulator }}
        INPUT_DESTINATION: ${{ inputs.destination }}
        INPUT_XCODEBUILD_ARG: ${{ inputs.xcodebuild-arg }}
        INPUT_OPERATOR_TIER: ${{ inputs.operator-tier }}
        INPUT_OPERATORS: ${{ inputs.operators }}
        INPUT_WORKERS: ${{ inputs.workers }}
        INPUT_PARALLELISM: ${{ inputs.parallelism }}
        INPUT_CACHE_PATH: ${{ inputs.cache-path }}
        INPUT_NO_CACHE: ${{ inputs.no-cache }}
        INPUT_NO_RESUME: ${{ inputs.no-resume }}
        INPUT_NO_SUPPRESSIONS: ${{ inputs.no-suppressions }}
        INPUT_REQUIRE_SUPPRESSION_REASON: ${{ inputs.require-suppression-reason }}
        INPUT_BUILD_TIMEOUT: ${{ inputs.build-timeout }}
        INPUT_BASELINE_TIMEOUT: ${{ inputs.baseline-timeout }}
        INPUT_MUTANT_TIMEOUT: ${{ inputs.mutant-timeout }}
        INPUT_MINIMUM_SCORE: ${{ inputs.minimum-score }}
        INPUT_BASELINE_REPORT: ${{ inputs.baseline-report }}
        INPUT_MAXIMUM_SCORE_DROP: ${{ inputs.maximum-score-drop }}
        INPUT_FAIL_ON_NEW_SURVIVORS: ${{ inputs.fail-on-new-survivors }}
        INPUT_MAXIMUM_INTEGRITY_WARNINGS: ${{ inputs.maximum-integrity-warnings }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_OUTPUT_PATH: ${{ inputs.output-path }}
        INPUT_TOOL_PATH: ${{ inputs.tool-path }}
      run: |
        set -euo pipefail
        engine_path="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        project_path="${INPUT_PROJECT:-$INPUT_PROJECT_PATH}"
        if [[ -z "$project_path" ]]; then
          echo "Set the required 'project' input to a Swift package, .xcodeproj, or .xcworkspace path." >&2
          exit 1
        fi
        if [[ "$project_path" != /* ]]; then project_path="$GITHUB_WORKSPACE/$project_path"; fi
        workers="${INPUT_WORKERS:-${INPUT_PARALLELISM:-2}}"
        destination="${INPUT_DESTINATION_SIMULATOR:-$INPUT_DESTINATION}"
        output_directory="${INPUT_OUTPUT:-${INPUT_OUTPUT_PATH:-.swift-mutation-testing}}"
        args=(run --project "$project_path" --project-kind "$INPUT_PROJECT_KIND" --operator-tier "$INPUT_OPERATOR_TIER" --workers "$workers" --build-timeout "$INPUT_BUILD_TIMEOUT" --baseline-timeout "$INPUT_BASELINE_TIMEOUT" --mutant-timeout "$INPUT_MUTANT_TIMEOUT" --maximum-integrity-warnings "$INPUT_MAXIMUM_INTEGRITY_WARNINGS")
        [[ -n "$INPUT_SCHEME" ]] && args+=(--scheme "$INPUT_SCHEME")
        while IFS= read -r value; do [[ -n "$value" ]] && args+=(--test-target "$value"); done <<< "$INPUT_TEST_TARGET"
        while IFS= read -r value; do [[ -n "$value" ]] && args+=(--test-target "$value"); done <<< "$INPUT_TEST_TARGETS"
        while IFS= read -r value; do [[ -n "$value" ]] && args+=(--test-package-root "$value"); done <<< "$INPUT_TEST_PACKAGE_ROOT"
        [[ -n "$INPUT_SOURCE_COMMIT" ]] && args+=(--source-commit "$INPUT_SOURCE_COMMIT")
        [[ -n "$INPUT_SOURCE_BASE" ]] && args+=(--source-base "$INPUT_SOURCE_BASE")
        [[ -n "$INPUT_SOURCE_SCOPE" ]] && args+=(--source-scope "$INPUT_SOURCE_SCOPE")
        [[ -n "$INPUT_TEST_SCOPE" ]] && args+=(--test-scope "$INPUT_TEST_SCOPE")
        while IFS= read -r value; do [[ -n "$value" ]] && args+=(--test-file-suffix "$value"); done <<< "$INPUT_TEST_FILE_SUFFIX"
        if [[ -n "$INPUT_CACHE_PATH" ]]; then
          cache_path="$INPUT_CACHE_PATH"
          project_root="$project_path"
          if [[ "$INPUT_PROJECT_KIND" == "xcode-project" || "$INPUT_PROJECT_KIND" == "xcode-workspace" ]]; then
            project_root="$(dirname "$project_path")"
          fi
          if [[ "$cache_path" != /* ]]; then cache_path="$project_root/$cache_path"; fi
          args+=(--cache-path "$cache_path")
        fi
        [[ "$INPUT_NO_CACHE" == "true" ]] && args+=(--no-cache)
        [[ "$INPUT_NO_RESUME" == "true" ]] && args+=(--no-resume)
        [[ "$INPUT_NO_SUPPRESSIONS" == "true" ]] && args+=(--no-suppressions)
        [[ "$INPUT_REQUIRE_SUPPRESSION_REASON" == "true" ]] && args+=(--require-suppression-reason)
        [[ -n "$destination" ]] && args+=(--destination-simulator "$destination")
        [[ -n "$INPUT_OPERATORS" ]] && args+=(--operators "$INPUT_OPERATORS")
        while IFS= read -r value; do [[ -n "$value" ]] && args+=(--xcodebuild-arg "$value"); done <<< "$INPUT_XCODEBUILD_ARG"
        [[ -n "$INPUT_MINIMUM_SCORE" ]] && args+=(--minimum-score "$INPUT_MINIMUM_SCORE")
        [[ -n "$INPUT_BASELINE_REPORT" ]] && args+=(--baseline-report "$INPUT_BASELINE_REPORT")
        [[ -n "$INPUT_MAXIMUM_SCORE_DROP" ]] && args+=(--maximum-score-drop "$INPUT_MAXIMUM_SCORE_DROP")
        [[ "$INPUT_FAIL_ON_NEW_SURVIVORS" == "true" ]] && args+=(--fail-on-new-survivors)
        while IFS= read -r value; do [[ -n "$value" ]] && args+=(--mutation-source "$value"); done <<< "$INPUT_MUTATION_SOURCE"
        while IFS= read -r value; do [[ -n "$value" ]] && args+=(--mutation-source "$value"); done <<< "$INPUT_SOURCE"
        while IFS= read -r value; do [[ -n "$value" ]] && args+=(--test-file "$value"); done <<< "$INPUT_TEST_FILE"
        while IFS= read -r value; do [[ -n "$value" ]] && args+=(--test-suite "$value"); done <<< "$INPUT_TEST_SUITE"
        while IFS= read -r value; do [[ -n "$value" ]] && args+=(--test-suite "$value"); done <<< "$INPUT_SUITE"
        while IFS= read -r value; do [[ -n "$value" ]] && args+=(--test-name "$value"); done <<< "$INPUT_TEST_NAME"
        while IFS= read -r value; do [[ -n "$value" ]] && args+=(--test-name "$value"); done <<< "$INPUT_TEST"
        output="$output_directory"
        if [[ "$output" != /* ]]; then output="$GITHUB_WORKSPACE/$output"; fi
        echo "report-directory=$output" >> "$GITHUB_OUTPUT"
        tool_binary="$INPUT_TOOL_PATH"
        tool_cache_path=""
        if [[ -n "$tool_binary" ]]; then
          if [[ ! -x "$tool_binary" ]]; then
            echo "Provided mutest-swift CLI is not executable: $tool_binary" >&2
            exit 1
          fi
          "$tool_binary" version
        elif [[ -n "$INPUT_CACHE_PATH" && "$INPUT_NO_CACHE" != "true" ]]; then
          toolchain_fingerprint="$( { xcode-select -p; swift --version; } | shasum -a 256 | awk '{print $1}')"
          package_fingerprint="$(cd "$engine_path" && { shasum -a 256 Package.swift Package.resolved; find Sources -type f -name '*.swift' -print | LC_ALL=C sort | while IFS= read -r file; do printf '%s ' "$file"; shasum -a 256 "$file" | awk '{print $1}'; done; } | shasum -a 256 | awk '{print $1}')"
          tool_cache_path="$cache_path/tool-binaries/$toolchain_fingerprint-$package_fingerprint/swift-mutation-testing"
          if [[ -f "$tool_cache_path" ]]; then
            chmod +x "$tool_cache_path"
            if "$tool_cache_path" version >/dev/null 2>&1; then tool_binary="$tool_cache_path"; fi
          fi
        fi
        if [[ -z "$tool_binary" ]]; then
          swift build --package-path "$engine_path" --product swift-mutation-testing
          binary_directory="$(swift build --package-path "$engine_path" --show-bin-path)"
          built_tool="$binary_directory/swift-mutation-testing"
          if [[ -n "$tool_cache_path" ]]; then
            mkdir -p "$(dirname "$tool_cache_path")"
            cp "$built_tool" "$tool_cache_path"
            chmod +x "$tool_cache_path"
            tool_binary="$tool_cache_path"
          else
            tool_binary="$built_tool"
          fi
        fi
        "$tool_binary" "${args[@]}" --output "$output"
        if [[ -f "$output/report.md" ]]; then
          echo "run-status=completed" >> "$GITHUB_OUTPUT"
        else
          echo "run-status=skipped" >> "$GITHUB_OUTPUT"
        fi
    - name: Add Markdown report to the job summary
      if: always()
      shell: bash
      env:
        REPORT_DIRECTORY: ${{ steps.arguments.outputs.report-directory }}
        RUN_STATUS: ${{ steps.arguments.outputs.run-status }}
      run: |
        REPORT_PATH="$REPORT_DIRECTORY/report.md"
        if [[ -f "$REPORT_PATH" ]]; then
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
        elif [[ "$RUN_STATUS" == "skipped" ]]; then
          echo "No changed production Swift files were found in the requested commit range. Mutation testing was skipped." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Mutation report was not produced. Check the earlier action logs for the failure." >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload mutation reports
      if: always() && steps.arguments.outputs.run-status != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: swift-mutation-testing-report
        path: |
          ${{ steps.arguments.outputs.report-directory }}/report.md
          ${{ steps.arguments.outputs.report-directory }}/report.json
        if-no-files-found: warn
    - name: Remove temporary mutation data
      if: always()
      shell: bash
      env:
        OUTPUT_PATH: ${{ steps.arguments.outputs.report-directory }}
      run: |
        set -euo pipefail
        workspace_root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
        output_path="$OUTPUT_PATH"
        [[ -d "$output_path" ]] || exit 0
        output_root="$(cd "$output_path" && pwd -P)"
        if [[ "$output_root" == "$workspace_root" || "$output_root" != "$workspace_root/"* ]]; then
          echo "Skipping temporary-data cleanup because the report directory is not a workspace subdirectory."
          exit 0
        fi
        for name in logs results workers sandboxes; do
          if [[ -d "$output_root/$name" ]]; then
            rm -rf -- "$output_root/$name"
          fi
        done
        echo "Removed temporary logs, Xcode result bundles, workers, and sandboxes."
