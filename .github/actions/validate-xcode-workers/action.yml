name: Validate parallel Xcode mutation workers
description: Exercise real simulator fixtures and compare serial/parallel app campaigns sequentially.
inputs:
  destination:
    description: Installed iOS Simulator destination used as a template
    required: true
  repetitions:
    description: Number of benchmark runs per worker count
    default: "3"
  skip-fixtures:
    description: Run only the app benchmark
    default: "false"
  extra-fixtures-only:
    description: Run only isolated-build and schema-narrowing fixtures
    default: "false"
  test-tool:
    description: Run the library unit and Swift package integration tests
    default: "true"
  output-path:
    description: Report folder relative to RUNNER_TEMP
    default: xcode-worker-validation
runs:
  using: composite
  steps:
    - name: Build tool and run Xcode worker acceptance checks
      shell: bash
      env:
        DESTINATION: ${{ inputs.destination }}
        REPETITIONS: ${{ inputs.repetitions }}
        SKIP_FIXTURES: ${{ inputs.skip-fixtures }}
        EXTRA_FIXTURES_ONLY: ${{ inputs.extra-fixtures-only }}
        TEST_TOOL: ${{ inputs.test-tool }}
        OUTPUT_PATH: ${{ inputs.output-path }}
      run: |
        set -euo pipefail
        engine_path="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        swift build --package-path "$engine_path" --product swift-mutation-testing
        if [[ "$TEST_TOOL" == "true" ]]; then swift test --package-path "$engine_path" --no-parallel; fi
        binary_directory="$(swift build --package-path "$engine_path" --show-bin-path)"
        args=(--tool "$binary_directory/swift-mutation-testing" --engine "$engine_path" --app-root "$GITHUB_WORKSPACE"
          --destination "$DESTINATION" --output "$RUNNER_TEMP/$OUTPUT_PATH" --repetitions "$REPETITIONS")
        [[ "$SKIP_FIXTURES" == "true" ]] && args+=(--skip-fixtures)
        [[ "$EXTRA_FIXTURES_ONLY" == "true" ]] && args+=(--extra-fixtures-only)
        python3 "$engine_path/Scripts/validate-xcode-workers.py" "${args[@]}"
    - name: Preserve validation reports and logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: xcode-worker-validation
        path: |
          ${{ runner.temp }}/${{ inputs.output-path }}/validation.json
          ${{ runner.temp }}/${{ inputs.output-path }}/validation.md
          ${{ runner.temp }}/${{ inputs.output-path }}/*/report.json
          ${{ runner.temp }}/${{ inputs.output-path }}/*/report.md
          ${{ runner.temp }}/${{ inputs.output-path }}/*/cli.log
          ${{ runner.temp }}/${{ inputs.output-path }}/*/logs/**
        if-no-files-found: warn
